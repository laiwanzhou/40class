input_manifest: D:\work\2026.7.14_kaggle\datasets\Small-Model-Track\roi640_depth_ordinal_256\combined_frame_manifest.csv
output_root: outputs/ir_primary_depth_residual_fullseq_fold0
device: cuda
seed: 20260715

depth_representation: raw
image_size: 256
